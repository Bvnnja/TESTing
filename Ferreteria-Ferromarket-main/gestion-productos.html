<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Productos - Ferromarket</title>
    <link rel="icon" href="img/ferromarket.png" type="image/png">
    <link rel="stylesheet" href="css/css-index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <style>
        .pagina-gestion-body {
            background-color: #f8f9fa;
            min-height: 100vh;
            padding: 40px 20px;
        }
        .contenedor-gestion {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
            background: #ffffff;
            border: 2px solid #000000;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 8px 8px 0px rgba(0, 0, 0, 1);
        }
        .gestion-cabecera {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #000000;
            padding-bottom: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 20px;
        }
        .gestion-titulo {
            font-size: 2.2rem;
            margin: 0;
            color: #222;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .gestion-acciones-top {
            display: flex;
            gap: 15px;
        }
        .btn-volver-catalogo {
            background-color: #ffffff;
            color: #000000;
            border: 2px solid #000000;
            border-radius: 12px;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 3px 3px 0px rgba(0, 0, 0, 1);
            font-family: 'Outfit', sans-serif;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-volver-catalogo:hover {
            background-color: #f1f3f4;
            transform: translate(-2px, -2px);
            box-shadow: 5px 5px 0px rgba(0, 0, 0, 1);
        }
        /* Neubrutalist table style */
        .tabla-productos-wrapper {
            overflow-x: auto;
            border: 2px solid #000000;
            border-radius: 12px;
            background: #ffffff;
            box-shadow: 5px 5px 0px rgba(0, 0, 0, 1);
            margin-bottom: 20px;
        }
        .tabla-productos-gestion {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-family: inherit;
        }
        .tabla-productos-gestion th,
        .tabla-productos-gestion td {
            padding: 14px 18px;
            border-bottom: 1px solid #e0e0e0;
        }
        .tabla-productos-gestion tr:last-child td {
            border-bottom: none;
        }
        .tabla-productos-gestion th {
            background-color: #f1f3f4;
            font-weight: bold;
            color: #000000;
            border-bottom: 2px solid #000000;
        }
        .tabla-img-thumb {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid #ddd;
        }
        .badge-categoria-gestion {
            background-color: #e2e3e5;
            color: #383d41;
            border: 1px solid #000;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 600;
            display: inline-block;
        }
        .tabla-acciones {
            display: flex;
            gap: 8px;
        }
        .btn-tabla-editar {
            background-color: #ffc107;
            color: #000000;
            border: 2px solid #000000;
            border-radius: 8px;
            padding: 6px 12px;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 2px 2px 0px rgba(0, 0, 0, 1);
            font-family: 'Outfit', sans-serif;
        }
        .btn-tabla-editar:hover {
            background-color: yellow;
            transform: translate(-1px, -1px);
            box-shadow: 3px 3px 0px rgba(0, 0, 0, 1);
        }
        .btn-tabla-eliminar {
            background-color: #dc3545;
            color: #ffffff;
            border: 2px solid #000000;
            border-radius: 8px;
            padding: 6px 12px;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 2px 2px 0px rgba(0, 0, 0, 1);
            font-family: 'Outfit', sans-serif;
        }
        .btn-tabla-eliminar:hover {
            background-color: #db4437;
            transform: translate(-1px, -1px);
            box-shadow: 3px 3px 0px rgba(0, 0, 0, 1);
        }
        .pantalla-carga-gestion {
            text-align: center;
            padding: 40px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #555;
        }
        /* Custom Modal Form */
        .modal-gestion-avanzado {
            max-width: 520px !important;
        }
    </style>
</head>
<body class="pagina-gestion-body">
    <!-- Verificación de Seguridad Inicial -->
    <div id="loader-pantalla" class="pantalla-carga-gestion" style="display: block;">
        <i class="fa fa-spinner fa-spin fa-2x"></i>
        <p>Verificando credenciales de administrador...</p>
    </div>
    <!-- Contenido Principal (oculto hasta verificar sesión) -->
    <div id="contenido-gestion-dashboard" class="contenedor-gestion" style="display: none;">
        <div class="gestion-cabecera">
            <h1 class="gestion-titulo"><i class="fa fa-cogs" style="color: var(--color-principal);"></i> Panel de Administración</h1>
            <div class="gestion-acciones-top">
                <button type="button" class="btn-admin-agregar-producto" id="btn-agregar-producto-dashboard">
                    <i class="fa fa-plus-circle"></i> Agregar Producto
                </button>
                <a href="index.html" class="btn-volver-catalogo">
                    <i class="fa fa-arrow-left"></i> Volver al Catálogo
                </a>
            </div>
        </div>
        <div class="tabla-productos-wrapper">
            <table class="tabla-productos-gestion">
                <thead>
                    <tr>
                        <th>Imagen</th>
                        <th>Nombre</th>
                        <th>Descripción</th>
                        <th>Precio</th>
                        <th>Stock</th>
                        <th>Categoría</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tabla-productos-body">
                    <!-- Dinámico -->
                </tbody>
            </table>
        </div>
    </div>
    <!-- Contenedor del Modal de Formulario -->
    <div id="modal-container-dashboard"></div>
    <!-- Templates -->
    <template id="plantilla-modal-gestion-producto">
        <div class="modal" id="modal-gestion-producto">
            <div class="contenido-modal modal-login-avanzado modal-gestion-avanzado">
                <span class="cerrar-modal">&times;</span>
                <div class="modal-login-contenedor">
                    <h2 class="modal-login-titulo" id="titulo-gestion-producto"><i class="fa fa-pencil-square-o"></i> Agregar Producto</h2>
                    <form id="formulario-gestion-producto" class="formulario-login">
                        <input type="hidden" id="gestion-id">
                        <div class="campo-formulario">
                            <label for="gestion-nombre">Nombre del Producto</label>
                            <input type="text" id="gestion-nombre" required placeholder="Ej. Taladro Percutor">
                        </div>
                        <div class="campo-formulario">
                            <label for="gestion-descripcion">Descripción</label>
                            <textarea id="gestion-descripcion" required placeholder="Descripción del producto..." style="font-family: inherit; padding: 10px; border: 2px solid #000; border-radius: 8px; resize: vertical; min-height: 80px; outline: none;"></textarea>
                        </div>
                        <div class="campo-formulario-row" style="display: flex; gap: 15px;">
                            <div class="campo-formulario" style="flex: 1;">
                                <label for="gestion-precio">Precio (CLP)</label>
                                <input type="number" id="gestion-precio" required min="0" placeholder="5000">
                            </div>
                            <div class="campo-formulario" style="flex: 1;">
                                <label for="gestion-cantidad">Stock</label>
                                <input type="number" id="gestion-cantidad" required min="0" placeholder="10">
                            </div>
                        </div>
                        <div class="campo-formulario-row" style="display: flex; gap: 15px;">
                            <div class="campo-formulario" style="flex: 1;">
                                <label for="gestion-categoria">Categoría</label>
                                <select id="gestion-categoria" required style="font-family: inherit; padding: 10px; border: 2px solid #000; border-radius: 8px; outline: none; background: #fff;">
                                    <option value="1">Producto 1</option>
                                    <option value="2">Producto 2</option>
                                    <option value="3">Producto 3</option>
                                    <option value="4">Producto 4</option>
                                    <option value="5">Producto 5</option>
                                    <option value="6">Producto 6</option>
                                    <option value="7">Producto 7</option>
                                    <option value="8">Producto 8</option>
                                    <option value="9">Producto 9</option>
                                    <option value="10">Producto 10</option>
                                </select>
                            </div>
                        </div>
                        <div class="campo-formulario">
                            <label for="gestion-imagen-file">Archivo de Imagen</label>
                            <input type="file" id="gestion-imagen-file" accept="image/*" style="font-family: inherit; padding: 10px; border: 2px solid #000; border-radius: 8px; outline: none; background: #fff; cursor: pointer;">
                            <div id="preview-imagen-contenedor" style="margin-top: 10px; display: none; text-align: center;">
                                <img id="preview-imagen-img" src="" alt="Vista previa" style="max-height: 120px; border: 2px solid #000; border-radius: 8px; box-shadow: 3px 3px 0px rgba(0,0,0,1); object-fit: cover;">
                            </div>
                        </div>
                        <button type="submit" class="btn-login-ingresar" id="btn-guardar-producto">Guardar Producto</button>
                    </form>
                </div>
            </div>
        </div>
    </template>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // --- CONFIGURACIÓN SUPABASE ---
        const SUPABASE_URL = 'https://fhvinwdaaybnwxpsivsi.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZodmlud2RhYXlibnd4cHNpdnNpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMzNjg2OTMsImV4cCI6MjA4ODk0NDY5M30.S0wYDW7utGuqRRCMu-k9w8FQ9mAWkk-92aX_GzZJ08E';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        let productosList = [];
        function esUsuarioAdmin(user) {
            if (!user) return false;
            return user.email === 'admin@ferromarket.cl' || user.user_metadata?.role === 'admin';
        }
        function obtenerFilePathDesdeUrl(url) {
            if (!url) return null;
            if (url.includes('/storage/v1/object/public/')) {
                const parts = url.split('/storage/v1/object/public/');
                if (parts.length > 1) {
                    const subparts = parts[1].split('/');
                    if (subparts.length > 1) {
                        return decodeURIComponent(subparts.slice(1).join('/'));
                    }
                }
            }
            return null;
        }
        async function verificarAcceso() {
            try {
                const { data: { session } } = await supabaseClient.auth.getSession();
                if (!session || !esUsuarioAdmin(session.user)) {
                    alert('Acceso denegado. Se requieren credenciales de administrador.');
                    window.location.href = 'index.html';
                    return;
                }
                
                // Mostrar panel y ocultar loader
                document.getElementById('loader-pantalla').style.display = 'none';
                document.getElementById('contenido-gestion-dashboard').style.display = 'block';
                
                // Inicializar datos
                cargarProductosTable();
                
                // Configurar botón agregar
                document.getElementById('btn-agregar-producto-dashboard').onclick = function() {
                    abrirModalForm(null);
                };
            } catch (err) {
                alert('Error al verificar sesión: ' + err.message);
                window.location.href = 'index.html';
            }
        }
        async function cargarProductosTable() {
            const tbody = document.getElementById('tabla-productos-body');
            tbody.innerHTML = '<tr><td colspan="7" style="text-align: center;"><i class="fa fa-spinner fa-spin"></i> Cargando productos...</td></tr>';
            
            const { data, error } = await supabaseClient.from('productos').select('*');
            if (error) {
                tbody.innerHTML = `<tr><td colspan="7" style="text-align: center; color: red;">Error al cargar productos: ${error.message}</td></tr>`;
                return;
            }
            
            productosList = data || [];
            tbody.innerHTML = '';
            
            if (productosList.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align: center;">No hay productos registrados.</td></tr>';
                return;
            }
            
            productosList.forEach((prod, index) => {
                const tr = document.createElement('tr');
                
                const descripcionCorta = prod.descripcion && prod.descripcion.length > 50 
                    ? prod.descripcion.slice(0, 50) + '...' 
                    : (prod.descripcion || '');
                
                tr.innerHTML = `
                    <td><img src="${prod.imagen_url || 'img/ferromarket.png'}" alt="${prod.nombre}" class="tabla-img-thumb"></td>
                    <td style="font-weight: bold;">${prod.nombre}</td>
                    <td style="color: #666; max-width: 250px;">${descripcionCorta}</td>
                    <td style="font-weight: bold; color: var(--color-principal);">$${prod.precio ? prod.precio.toLocaleString('es-CL') : '0'}</td>
                    <td>${prod.cantidad || '0'}</td>
                    <td><span class="badge-categoria-gestion">Producto ${prod.categoria || '1'}</span></td>
                    <td>
                        <div class="tabla-acciones">
                            <button class="btn-tabla-editar" onclick="editarProducto(${index})"><i class="fa fa-pencil"></i></button>
                            <button class="btn-tabla-eliminar" onclick="eliminarProducto(${index})"><i class="fa fa-trash"></i></button>
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }
        function abrirModalForm(producto) {
            const modalContainer = document.getElementById('modal-container-dashboard');
            modalContainer.innerHTML = '';
            const template = document.getElementById('plantilla-modal-gestion-producto');
            if (!template) return;
            const clone = template.content.cloneNode(true);
            const modal = clone.querySelector('.modal');
            
            const titulo = clone.querySelector('#titulo-gestion-producto');
            const form = clone.querySelector('#formulario-gestion-producto');
            
            const inputId = clone.querySelector('#gestion-id');
            const inputNombre = clone.querySelector('#gestion-nombre');
            const inputDescripcion = clone.querySelector('#gestion-descripcion');
            const inputPrecio = clone.querySelector('#gestion-precio');
            const inputCantidad = clone.querySelector('#gestion-cantidad');
            const inputCategoria = clone.querySelector('#gestion-categoria');
            const inputImagenFile = clone.querySelector('#gestion-imagen-file');
            const previewContenedor = clone.querySelector('#preview-imagen-contenedor');
            const previewImg = clone.querySelector('#preview-imagen-img');
            
            // Vista previa al seleccionar imagen
            inputImagenFile.onchange = function() {
                const file = inputImagenFile.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        previewImg.src = e.target.result;
                        previewContenedor.style.display = 'block';
                    }
                    reader.readAsDataURL(file);
                } else {
                    if (producto) {
                        previewImg.src = producto.imagen_url || '';
                        previewContenedor.style.display = producto.imagen_url ? 'block' : 'none';
                    } else {
                        previewContenedor.style.display = 'none';
                        previewImg.src = '';
                    }
                }
            };
            
            if (producto) {
                // Modo Edición
                titulo.innerHTML = '<i class="fa fa-pencil-square-o"></i> Editar Producto';
                inputId.value = producto.id;
                inputNombre.value = producto.nombre || '';
                inputDescripcion.value = producto.descripcion || '';
                inputPrecio.value = producto.precio || 0;
                inputCantidad.value = producto.cantidad || 0;
                inputCategoria.value = producto.categoria || '1';
                inputImagenFile.required = false; // Opcional en edición
                if (producto.imagen_url) {
                    previewImg.src = producto.imagen_url;
                    previewContenedor.style.display = 'block';
                }
            } else {
                // Modo Creación
                titulo.innerHTML = '<i class="fa fa-plus-circle"></i> Agregar Producto';
                inputId.value = '';
                inputNombre.value = '';
                inputDescripcion.value = '';
                inputPrecio.value = '';
                inputCantidad.value = '';
                inputCategoria.value = '1';
                inputImagenFile.required = true; // Requerido al crear
                previewContenedor.style.display = 'none';
                previewImg.src = '';
            }
            
            form.onsubmit = async function(e) {
                e.preventDefault();
                const id = inputId.value;
                
                const submitBtn = form.querySelector('#btn-guardar-producto');
                const originalText = submitBtn.textContent;
                submitBtn.textContent = 'Guardando...';
                submitBtn.disabled = true;
                
                let finalImageUrl = producto ? producto.imagen_url : '';
                let successfulBucket = null;
                const file = inputImagenFile.files[0];
                
                try {
                    // Si se seleccionó un archivo nuevo, subirlo a Supabase Storage
                    if (file) {
                        const fileExt = file.name.split('.').pop();
                        const fileName = `prod_${Date.now()}_${Math.random().toString(36).substring(2, 8)}.${fileExt}`;
                        const filePath = `${fileName}`;
                        
                        let uploadData = null;
                        let uploadError = null;
                        const candidateBuckets = ['imagenes', 'IMAGENES', 'Imagenes'];
                        
                        for (const bucketName of candidateBuckets) {
                            const { data, error } = await supabaseClient
                                .storage
                                .from(bucketName)
                                .upload(filePath, file);
                            
                            if (!error) {
                                uploadData = data;
                                successfulBucket = bucketName;
                                break;
                            } else if (error.message !== 'Bucket not found') {
                                // Si es un error de permisos u otro tipo de error, detenemos el loop y reportamos
                                uploadError = error;
                                successfulBucket = bucketName;
                                break;
                            } else {
                                // Guardamos el error de "Bucket not found" y probamos con el siguiente
                                uploadError = error;
                            }
                        }
                        
                        if (uploadError && !successfulBucket) {
                            alert('Error al subir la imagen a Supabase Storage: ' + uploadError.message + 
                                  '\n\nNo se encontró el bucket usando los nombres: "imagenes", "IMAGENES" o "Imagenes". Por favor verifica cómo se llama el ID del bucket en tu panel.');
                            submitBtn.textContent = originalText;
                            submitBtn.disabled = false;
                            return;
                        }
                        
                        if (uploadError && successfulBucket) {
                            alert('Error de permisos al subir la imagen al bucket "' + successfulBucket + '": ' + uploadError.message + 
                                  '\n\nPor favor, verifica que hayas creado la política de acceso (Policy) sobre el bucket en Supabase Storage que permita las operaciones INSERT, SELECT y UPDATE.');
                            submitBtn.textContent = originalText;
                            submitBtn.disabled = false;
                            return;
                        }
                        
                        // Obtener la URL pública de la imagen subida usando el bucket que funcionó
                        const { data: urlData } = supabaseClient
                            .storage
                            .from(successfulBucket)
                            .getPublicUrl(filePath);
                        
                        finalImageUrl = urlData.publicUrl;
                    } else if (!producto) {
                        alert('Por favor selecciona un archivo de imagen.');
                        submitBtn.textContent = originalText;
                        submitBtn.disabled = false;
                        return;
                    }
                    
                    const payload = {
                        nombre: inputNombre.value,
                        descripcion: inputDescripcion.value,
                        precio: parseFloat(inputPrecio.value),
                        cantidad: parseInt(inputCantidad.value),
                        categoria: inputCategoria.value,
                        imagen_url: finalImageUrl
                    };
                    
                    let error = null;
                    let data = null;
                    
                    if (id) {
                        // Update
                        const res = await supabaseClient.from('productos').update(payload).eq('id', id).select();
                        error = res.error;
                        data = res.data;
                    } else {
                        // Insert
                        const res = await supabaseClient.from('productos').insert([payload]).select();
                        error = res.error;
                        data = res.data;
                    }
                    
                    submitBtn.textContent = originalText;
                    submitBtn.disabled = false;
                    
                    if (error) {
                        alert('Error al guardar producto: ' + error.message);
                        return;
                    }
                    
                    if (!data || data.length === 0) {
                        alert('Error: No se guardaron los cambios. Esto ocurre si las políticas RLS (Row Level Security) en la tabla "productos" de Supabase están activas y bloquean la escritura.');
                        return;
                    }
                    
                    // Si se editó el producto y se subió una nueva imagen, borrar la antigua de Supabase Storage
                    if (id && producto && producto.imagen_url && producto.imagen_url !== finalImageUrl) {
                        const oldFilePath = obtenerFilePathDesdeUrl(producto.imagen_url);
                        if (oldFilePath) {
                            try {
                                await supabaseClient
                                    .storage
                                    .from(successfulBucket)
                                    .remove([oldFilePath]);
                            } catch (delErr) {
                                console.error('Error al borrar la imagen antigua:', delErr);
                            }
                        }
                    }
                    
                    alert('¡Producto guardado correctamente!');
                    modal.style.display = 'none';
                    modalContainer.innerHTML = '';
                    cargarProductosTable();
                } catch (err) {
                    submitBtn.textContent = originalText;
                    submitBtn.disabled = false;
                    alert('Error inesperado: ' + err.message);
                }
            };
            
            modal.style.display = 'block';
            
            clone.querySelector('.cerrar-modal').onclick = function() {
                modal.style.display = 'none';
                modalContainer.innerHTML = '';
            };
            
            window.onclick = function(event) {
                if (event.target == modal) {
                    modal.style.display = 'none';
                    modalContainer.innerHTML = '';
                }
            };
            
            modalContainer.appendChild(clone);
        }
        function editarProducto(index) {
            const prod = productosList[index];
            if (prod) {
                abrirModalForm(prod);
            }
        }
        async function eliminarProducto(index) {
            const prod = productosList[index];
            if (!prod) return;
            
            if (confirm(`¿Estás seguro de que deseas eliminar el producto "${prod.nombre}"?`)) {
                try {
                    const { data, error } = await supabaseClient.from('productos').delete().eq('id', prod.id).select();
                    if (error) {
                        alert('Error al eliminar producto: ' + error.message);
                        return;
                    }
                    if (!data || data.length === 0) {
                        alert('Error: No se pudo eliminar el producto. Esto ocurre si las políticas RLS en Supabase están activas y bloquean la eliminación.');
                        return;
                    }
                    
                    // Borrar la imagen de Supabase Storage si corresponde
                    if (prod.imagen_url) {
                        const oldFilePath = obtenerFilePathDesdeUrl(prod.imagen_url);
                        if (oldFilePath) {
                            try {
                                const candidateBuckets = ['imagenes', 'IMAGENES', 'Imagenes'];
                                for (const bucketName of candidateBuckets) {
                                    const { error: delError } = await supabaseClient
                                        .storage
                                        .from(bucketName)
                                        .remove([oldFilePath]);
                                    if (!delError) break; // Se borró con éxito de alguno de los buckets candidatos
                                }
                            } catch (delErr) {
                                console.error('Error al borrar la imagen del storage:', delErr);
                            }
                        }
                    }
                    
                    alert('Producto eliminado con éxito.');
                    cargarProductosTable();
                } catch (err) {
                    alert('Error inesperado: ' + err.message);
                }
            }
        }
        // Ejecutar verificación al cargar
        document.addEventListener('DOMContentLoaded', verificarAcceso);
    </script>
</body>
