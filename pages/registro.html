<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Ferromarket</title>
    <link rel="icon" href="../assets/img/ui/ferromarket.png" type="image/png">
    <link rel="stylesheet" href="../assets/css/index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="../assets/css/registro.css">
</head>
<body class="pagina-registro-body">
    <div class="contenedor-registro">
        <div class="registro-logo">
            <a href="../index.html">
                <img src="../assets/img/ui/ferromarket.png" alt="Logo de Ferromarket">
            </a>
        </div>
        <h2 class="registro-titulo"><i class="fa fa-user-plus"></i> Crear Cuenta</h2>
        
        <form id="formulario-registro" class="formulario-login">
            <div class="campo-formulario">
                <label for="registro-nombre">Nombre Completo</label>
                <input type="text" id="registro-nombre" required placeholder="Ingresa tu nombre" pattern="^[A-Za-záéíóúÁÉÍÓÚñÑ\s]+$" title="El nombre solo debe contener letras y espacios, sin números ni caracteres especiales.">
            </div>
            <div class="campo-formulario">
                <label for="registro-email">Correo Electrónico</label>
                <input type="email" id="registro-email" required placeholder="correo@ejemplo.com">
            </div>
            <div class="campo-formulario">
                <label for="registro-telefono">Teléfono</label>
                <input type="tel" id="registro-telefono" required placeholder="+56912345678" pattern="^\+569[0-9]{8}$" title="El formato debe ser +569 seguido de 8 dígitos numéricos. Ejemplo: +56912345678">
            </div>
            <div class="campo-formulario">
                <label for="registro-password">Contraseña</label>
                <input type="password" id="registro-password" required placeholder="Crea una contraseña (mín. 6 caracteres)" minlength="6">
                <div class="password-strength-container" style="margin-top: 8px;">
                    <div class="password-strength-bars" style="display: flex; gap: 4px; height: 6px; border-radius: 4px; overflow: hidden; background: #e0e0e0;">
                        <div id="strength-bar-1" style="flex: 1; transition: background-color 0.3s;"></div>
                        <div id="strength-bar-2" style="flex: 1; transition: background-color 0.3s;"></div>
                        <div id="strength-bar-3" style="flex: 1; transition: background-color 0.3s;"></div>
                        <div id="strength-bar-4" style="flex: 1; transition: background-color 0.3s;"></div>
                    </div>
                    <small id="password-strength-text" style="display: block; margin-top: 5px; font-weight: bold; color: #666;">Seguridad: Débil</small>
                </div>
            </div>
            <div class="campo-formulario">
                <label for="registro-password-confirm">Confirmar Contraseña</label>
                <input type="password" id="registro-password-confirm" required placeholder="Confirma tu contraseña" minlength="6">
            </div>
            
            <button type="submit" class="btn-registro-ingresar">Registrarse</button>
        </form>
        <div class="registro-pie">
            <p>¿Ya tienes cuenta? <a href="../index.html?login=true">Inicia sesión aquí</a></p>
        </div>
    </div>
    
    <div id="toast-container" class="toast-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/config/supabase-config.js"></script>
    <script src="../js/views/registro.js"></script>
</body>
</html>
