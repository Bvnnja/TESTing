<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Pedidos - Ferromarket</title>
    <link rel="icon" href="../assets/img/ui/ferromarket.png" type="image/png">
    <link rel="stylesheet" href="../assets/css/index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="../assets/css/admin.css">
    <link rel="stylesheet" href="../assets/css/compras.css">
    <style>
        .select-estado {
            padding: 8px;
            font-family: 'Outfit', sans-serif;
            font-weight: 800;
            border: 2px solid #000;
            border-radius: 6px;
            background: #fff;
            cursor: pointer;
            box-shadow: 2px 2px 0px #000;
        }
        .select-estado:focus {
            outline: none;
            box-shadow: 2px 2px 0px #1fb546;
        }
        .btn-guardar-estado {
            padding: 8px 12px;
            background: #1fb546;
            color: #fff;
            border: 2px solid #000;
            border-radius: 6px;
            font-family: 'Outfit', sans-serif;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 2px 2px 0px #000;
            margin-left: 5px;
        }
        .btn-guardar-estado:hover:not(:disabled) {
            transform: translate(-1px, -1px);
            box-shadow: 3px 3px 0px #000;
        }
        .btn-guardar-estado:disabled {
            background: #ccc;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }
        .td-acciones {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .btn-accion-texto {
            padding: 8px 12px;
            background: #000;
            color: #fff;
            border: 2px solid #000;
            border-radius: 6px;
            font-family: 'Outfit', sans-serif;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 2px 2px 0px #1fb546;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }
        .btn-accion-texto:hover {
            background: #1fb546;
            color: #000;
            transform: translate(-1px, -1px);
            box-shadow: 3px 3px 0px #000;
        }
    </style>
</head>
<body class="pagina-gestion-body">
    <!-- Verificación de Seguridad Inicial -->
    <div id="loader-pantalla" class="pantalla-carga-gestion" style="display: block;">
        <i class="fa fa-spinner fa-spin fa-2x"></i>
        <p>Verificando credenciales de administrador...</p>
    </div>
    
    <!-- Contenido Principal -->
    <div id="contenido-gestion-dashboard" class="contenedor-gestion" style="display: none;">
        <div class="gestion-cabecera">
            <h1 class="gestion-titulo"><i class="fa fa-truck" style="color: var(--color-principal);"></i> Gestión de Pedidos</h1>
            <div class="gestion-acciones-top">
                <a href="../index.html" class="btn-volver-catalogo">
                    <i class="fa fa-arrow-left"></i> Volver al Catálogo
                </a>
            </div>
        </div>

        <div class="panel-contenido">
            <div class="gestion-herramientas" style="margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between; gap: 20px; flex-wrap: wrap;">
                
                <div class="gestion-buscador-contenedor" style="flex: 1; min-width: 250px; display: flex; align-items: center; background: #fff; padding: 12px 18px; border: 2px solid #000; border-radius: 12px; box-shadow: 4px 4px 0px #000;">
                    <i class="fa fa-search" style="color: #666; font-size: 1.2rem; margin-right: 12px;"></i>
                    <input type="text" id="buscador-pedidos" placeholder="Buscar por código, nombre o correo..." style="flex: 1; border: none; outline: none; font-size: 1rem; font-family: 'Outfit', sans-serif; background: transparent;">
                </div>

                <div class="gestion-filtro-contenedor" style="display:flex; gap: 12px; align-items:center; background: #fff; padding: 12px 18px; border: 2px solid #000; border-radius: 12px; box-shadow: 4px 4px 0px #000;">
                    <label style="font-weight:700; margin: 0; font-size: 1rem;"><i class="fa fa-filter"></i> Filtrar:</label>
                    <select id="filtro-estado" class="select-estado" style="border: none; box-shadow: none; padding: 0; font-size: 1rem; cursor: pointer; outline: none; background: transparent;">
                        <option value="todos">Todos los Estados</option>
                        <option value="Pendiente">Pendiente</option>
                        <option value="Completado">Completado</option>
                        <option value="Cancelado">Cancelado</option>
                    </select>
                </div>
                
            </div>

            <!-- Tabla de Pedidos -->
            <div class="tabla-productos-wrapper">
                <table class="tabla-productos-gestion" id="tabla-pedidos">
                    <thead>
                        <tr>
                            <th>Código Orden</th>
                            <th>Cliente</th>
                            <th>Fecha</th>
                            <th>Total</th>
                            <th>Método Pago</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tbody-pedidos">
                        <tr>
                            <td colspan="7" style="text-align: center; padding: 40px;">
                                <i class="fa fa-spinner fa-spin fa-2x"></i>
                                <p style="margin-top: 10px;">Cargando pedidos desde la base de datos...</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal Detalles de Compra (Reutilizado de compras) -->
    <div class="modal-detalle-overlay" id="modal-detalle-compra" style="display: none;">
        <div class="modal-detalle-box">
            <button class="btn-cerrar-modal" id="btn-cerrar-detalle"><i class="fa fa-times"></i></button>
            <h3 class="modal-detalle-titulo">Detalle del Pedido <span id="detalle-codigo-orden">FM-000000</span></h3>
            
            <div class="detalle-info-basica">
                <p><strong>Cliente:</strong> <span id="detalle-cliente">--</span></p>
                <p><strong>Fecha:</strong> <span id="detalle-fecha">--</span></p>
                <p><strong>Estado:</strong> <span class="badge-estado" id="detalle-estado">--</span></p>
                <p><strong>Método de pago:</strong> <span id="detalle-pago">--</span></p>
            </div>

            <div class="detalle-productos-lista" id="detalle-productos-lista">
                <!-- Dinamico -->
            </div>

            <div class="detalle-total">
                <span>Total Pagado:</span>
                <span id="detalle-total-monto">$0</span>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/config/supabase-config.js"></script>
    <script src="../js/views/gestion-pedidos.js"></script>
</body>
</html>
